services:
  - type: web
    runtime: static
    # Existing Render service identifier. Renaming it here would provision a new
    # service, so it keeps its historical value; change it in the Render dashboard.
    name: lunch-line-survey
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Security headers (LC-04). Built from what the app actually contacts: its own origin, the Lunchvoice
    # Supabase project (Data API + session function) and the KpnIdentity issuer (token exchange). The sign-in
    # redirect to KpnIdentity/Google is a top-level navigation, which CSP does not restrict. script-src pins the
    # theme pre-paint script in index.html by hash: if that script changes, recompute the hash (see
    # docs/backend/PRODUCTION_RESET_RUNBOOK.md). style-src keeps 'unsafe-inline' because toasts inject a style
    # element and React/Radix set inline styles; scripts stay strict.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-kU0Cb4JIx44Xq6Y1Z0qnsT36nfN1wDLltqHWX/KPdyQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://qprfonxvthmaoxfixigk.supabase.co https://axzwdbizblfkspduqilj.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()
      - path: /*
        name: X-Frame-Options
        value: DENY
    # SEO (src/config/seo.json, scripts/seo-prerender.mjs): each indexable public page has its own prerendered
    # HTML with its title, description, canonical and a static content fallback. Rules apply in order, so these
    # come before the catch-all. Every other client-side route (/signin, /{hubSlug}, /c/:joinCode) gets the
    # noindex SPA shell app.html. scripts/seo-prerender.test.mjs keeps this list in step with seo.json.
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /how-it-works
        destination: /how-it-works/index.html
      - type: rewrite
        source: /use-cases
        destination: /use-cases/index.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /waitlist
        destination: /waitlist/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /discover
        destination: /discover/index.html
      - type: rewrite
        source: /support
        destination: /support/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /guidelines
        destination: /guidelines/index.html
      - type: rewrite
        source: /*
        destination: /app.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
