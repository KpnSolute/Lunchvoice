services:
  - type: web
    runtime: static
    name: lunch-line-survey
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: serve index.html for client-side routes (/join, /survey/:id, /admin/*)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
