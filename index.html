<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunchVoice</title>
  <meta name="description" content="Hubs, campaigns and aggregate results." />
  <meta name="theme-color" content="#EEEDEA" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  <meta property="og:title" content="LunchVoice" />
  <meta property="og:description" content="Hubs, campaigns and aggregate results." />
  <meta property="og:image" content="/brand/lunchvoice-mark.svg" />
  <!-- Fonts are self-hosted (src/ui/fonts.css, SIL OFL 1.1; licenses in /licenses). -->
  <script>
    /* Apply the saved theme before first paint (same rules as src/ui/theme.ts). */
    (function () {
      try {
        var pref = localStorage.getItem('lv.theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = pref === 'light' || pref === 'dark' || pref === 'hc' ? pref : dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
