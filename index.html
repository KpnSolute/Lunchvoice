<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunchVoice · Community feedback that stays private</title>
  <meta name="description" content="Hubs and Campaigns for any community: surveys, polls, ratings and ideas with privacy-safe results. Participation is always free." />
  <meta name="theme-color" content="#EEEDEA" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  <meta property="og:title" content="LunchVoice" />
  <meta property="og:description" content="Community feedback that stays private. Hubs, Campaigns and withheld results that are never reported as zero." />
  <meta property="og:image" content="/brand/lunchvoice-mark.svg" />

  <!-- Fonts are self-hosted (latin + latin-ext, swap). Nothing loads from Google.
       Preload the two faces that paint above the fold: Bricolage 800 and Geist 400. -->
  <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Appearance is machine-set, never user-set. The machine's light/dark preference
       picks one of the two palettes before first paint — page (light) or ink (dark) —
       so nobody sees a flash of the wrong one, and nothing stored can override it.
       Keep this in sync with src/ui/theme.tsx. -->
  <script>
    (function () {
      var root = document.documentElement;
      var ink = false;
      try {
        ink = window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {
        ink = false;
      }
      root.dataset.theme = ink ? "ink" : "page";
      root.style.colorScheme = ink ? "dark" : "light";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", ink ? "#17140F" : "#EEEDEA");
    })();
  </script>

  <!-- The boot screen: the final signature (v1.0.0) writing itself until React takes
       over. Its styles are inline because it paints before any stylesheet bundle, and
       it follows the same machine-set palette as the app. React clears it on the first
       commit, so it never lingers. -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #eeedea;
      color: #17140f;
      z-index: 90;
    }
    #boot kpn-signature {
      display: block;
      width: 160px;
      height: 64px;
    }
    @media (prefers-color-scheme: dark) {
      #boot {
        background: #17140f;
        color: #f7f3ea;
      }
    }
  </style>
  <script src="/brand/kpn-signature@1.js" defer></script>
</head>
<body>
  <div id="root">
    <div id="boot">
      <kpn-signature mode="loader" label="Loading LunchVoice"></kpn-signature>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
