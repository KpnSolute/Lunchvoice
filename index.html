<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunchVoice · Community feedback that stays private</title>
  <meta name="description" content="Hubs and Campaigns for any community: surveys, polls, ratings and ideas with privacy-safe results. Participation is always free." />
  <meta name="theme-color" content="#EEEDEA" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  <meta property="og:title" content="LunchVoice" />
  <meta property="og:description" content="Community feedback that stays private. Hubs, Campaigns and withheld results that are never reported as zero." />
  <meta property="og:image" content="/brand/lunchvoice-mark.svg" />

  <!-- Fonts are self-hosted (latin + latin-ext, swap). Nothing loads from Google.
       Preload the two faces that paint above the fold: Bricolage 800 and Geist 400. -->
  <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Light and dark follow the machine, not a stored preference: resolve the tokens
       from prefers-color-scheme before first paint so a dark-mode user never sees a
       white flash. High contrast is the only appearance choice the user makes.
       Keep this in sync with src/ui/theme.tsx. -->
  <script>
    (function () {
      var root = document.documentElement;
      var dark = false;
      try {
        dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {
        dark = false;
      }
      root.dataset.theme = dark ? "dark" : "light";
      root.style.colorScheme = dark ? "dark" : "light";
      var contrast = "normal";
      try {
        contrast = localStorage.getItem("lv.contrast") === "high" ? "high" : "normal";
      } catch (e) {
        contrast = "normal";
      }
      root.dataset.contrast = contrast;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
