name: Version, test, and tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lunchvoice-main-versioning
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate project memory and release policy
        run: |
          npm run check:brain
          npm run check:release
          node scripts/release-policy.mjs plan > release-plan.tsv
          cat release-plan.tsv

      - name: Run light tests
        run: npm run test:light

      - name: Decide whether heavy tests are required
        id: heavy
        shell: bash
        run: |
          if awk -F '\t' '$4 == "true" { found=1 } END { exit !found }' release-plan.tsv; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run heavy tests
        if: steps.heavy.outputs.required == 'true'
        run: npm run test:heavy

      - name: Tag every new main commit and publish milestones
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "lunchvoice-release-bot"
          git config user.email "185634131+KpnWorld@users.noreply.github.com"
          while IFS=$'\t' read -r commit tag class heavy; do
            git tag -a "$tag" "$commit" -m "Lunchvoice $tag"
            git push origin "$tag"
            if [ "$class" = "prerelease" ]; then
              gh release create "$tag" --prerelease --generate-notes --title "Lunchvoice $tag"
            elif [ "$class" = "main" ]; then
              gh release create "$tag" --generate-notes --title "Lunchvoice $tag"
            fi
          done < release-plan.tsv
