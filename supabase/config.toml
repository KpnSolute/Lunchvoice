project_id = "qprfonxvthmaoxfixigk"

# The session function verifies the KpnIdentity ID token itself (JWKS, issuer, audience, nonce),
# so the platform's own JWT check on the request is off. See docs/v2/KPNIDENTITY_SETUP.md.
[functions.session]
verify_jwt = false

# Stripe calls the billing webhook without a Supabase JWT; the function verifies the Stripe-Signature itself
# and fails closed (503) while STRIPE_WEBHOOK_SECRET is unset.
[functions.billing-webhook]
verify_jwt = false
