project_id = "qprfonxvthmaoxfixigk"

# The session function verifies the KpnIdentity ID token itself (JWKS, issuer, audience, nonce),
# so the platform's own JWT check on the request is off. See docs/v2/KPNIDENTITY_SETUP.md.
[functions.session]
verify_jwt = false

# Stripe calls the billing webhook without a Supabase JWT; the function verifies the Stripe-Signature itself
# and fails closed (503) while STRIPE_WEBHOOK_SECRET is unset.
[functions.billing-webhook]
verify_jwt = false

# The caller holds a LunchVoice session (ES256, issued by `session`), not a Supabase Auth JWT, so the gateway check
# is off. The function forwards that token to PostgREST, so the database authenticates the caller (lv_checkout_start,
# lv_billing_portal_check) before anything is created at Stripe. Fails closed (503) while STRIPE_SECRET_KEY is unset.
[functions.checkout]
verify_jwt = false

# Service role only: the function compares the bearer with SUPABASE_SERVICE_ROLE_KEY (or EMAIL_DISPATCH_SECRET) in
# constant time itself. The gateway check is off because it would also accept the public anon key.
[functions.email-dispatch]
verify_jwt = false

# The public LunchVoice API: callers present a Hub API key (lvk_...), not a Supabase JWT. The function hashes the key
# and lv.api_key_call (service role only) authenticates it, so the gateway check is off.
[functions.api]
verify_jwt = false

# Discord calls the interactions endpoint without a Supabase JWT; the function verifies Discord's Ed25519 signature
# with DISCORD_PUBLIC_KEY and fails closed while it is unset. /discord/dispatch is service role only (bearer compared
# in constant time).
[functions.discord]
verify_jwt = false

# Service role only: the function compares the bearer with SUPABASE_SERVICE_ROLE_KEY (or EMAIL_DISPATCH_SECRET) in
# constant time itself. The gateway check is off because it would also accept the public anon key.
[functions.webhook-dispatch]
verify_jwt = false
